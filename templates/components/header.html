{{ define "header" }}
<header
    class="
        sticky top-0 z-50
        border-b border-[#18312F]/10
        bg-[#FAF9F6]/95
        font-sans
        backdrop-blur-xl
    "
>
    <div class="mx-auto max-w-6xl px-4 sm:px-6">
        <div class="flex h-20 items-center justify-between lg:h-24">

            <!-- Brand -->
            <a
                href="/"
                class="flex min-w-0 items-center gap-3"
                aria-label="Studio Hair & Beauty home"
            >
                <img
                    src="/static/images/logo.svg"
                    alt=""
                    class="size-11 shrink-0 sm:size-12 lg:size-14"
                    aria-hidden="true"
                >

                <div class="min-w-0 leading-none">
                    <span
                        class="
                            block
                            text-[0.95rem]
                            font-medium
                            tracking-[0.08em]
                            text-[#18312F]
                            sm:text-base
                            lg:text-lg
                        "
                    >
                        Studio Hair
                    </span>

                    <span
                        class="
                            mt-1.5 block
                            text-[0.55rem]
                            font-semibold
                            uppercase
                            tracking-[0.28em]
                            text-[#218F86]
                            sm:text-[0.6rem]
                        "
                    >
                        Hair & Beauty
                    </span>
                </div>
            </a>

            <!-- Desktop -->
            <div class="hidden items-center gap-9 lg:flex">
                <nav aria-label="Main navigation">
                    <ul
                        class="
                            flex items-center gap-8
                            text-[0.72rem]
                            font-semibold
                            uppercase
                            tracking-[0.14em]
                            text-[#18312F]/65
                        "
                    >
                        <li>
                            <a
                                href="/"
                                class="transition hover:text-[#218F86]"
                            >
                                Home
                            </a>
                        </li>

                        <li>
                            <a
                                href="/services"
                                class="transition hover:text-[#218F86]"
                            >
                                Services
                            </a>
                        </li>

                        <li>
                            <a
                                href="/gallery"
                                class="transition hover:text-[#218F86]"
                            >
                                Gallery
                            </a>
                        </li>

                        <li>
                            <a
                                href="/team"
                                class="transition hover:text-[#218F86]"
                            >
                                Our Team
                            </a>
                        </li>

                        <li>
                            <a
                                href="/contact"
                                class="transition hover:text-[#218F86]"
                            >
                                Contact
                            </a>
                        </li>
                    </ul>
                </nav>

                <a
                    href="/contact"
                    class="
                        inline-flex items-center justify-center
                        bg-[#218F86]
                        px-6 py-3
                        text-[0.7rem]
                        font-semibold
                        uppercase
                        tracking-[0.18em]
                        text-white
                        transition
                        hover:bg-[#197A73]
                    "
                >
                    Book Now
                </a>
            </div>

            <!-- Mobile -->
            <details class="group relative shrink-0 lg:hidden">
                <summary
                    class="
                        flex cursor-pointer list-none
                        items-center justify-center
                        p-2
                        text-[#18312F]
                        transition
                        hover:text-[#218F86]
                    "
                    aria-label="Toggle navigation"
                >
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        class="size-7 group-open:hidden"
                        aria-hidden="true"
                    >
                        <path d="M4 7h16M4 12h16M4 17h16"></path>
                    </svg>

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        class="hidden size-7 group-open:block"
                        aria-hidden="true"
                    >
                        <path d="M6 6l12 12M18 6L6 18"></path>
                    </svg>
                </summary>

                <nav
                    class="
                        absolute right-0 top-full
                        mt-4
                        w-[min(22rem,calc(100vw-2rem))]
                        border border-[#18312F]/10
                        bg-[#FAF9F6]
                        shadow-[0_24px_70px_rgba(24,49,47,0.18)]
                    "
                    aria-label="Mobile navigation"
                >

                    <!-- Brand -->
                    <div
                        class="
                            flex items-center gap-3
                            border-b border-[#18312F]/10
                            px-5 py-5
                        "
                    >
                        <img
                            src="/static/images/logo.svg"
                            alt=""
                            class="size-12 shrink-0"
                            aria-hidden="true"
                        >

                        <div class="leading-none">
                            <span
                                class="
                                    block text-base
                                    font-medium
                                    tracking-[0.06em]
                                    text-[#18312F]
                                "
                            >
                                Studio Hair
                            </span>

                            <span
                                class="
                                    mt-1.5 block
                                    text-[0.6rem]
                                    font-semibold
                                    uppercase
                                    tracking-[0.28em]
                                    text-[#218F86]
                                "
                            >
                                Hair & Beauty
                            </span>
                        </div>
                    </div>

                    <ul
                        class="
                            flex flex-col
                            px-5 py-4
                            text-sm
                            font-medium
                            text-[#18312F]/75
                        "
                    >
                        <li>
                            <a href="/" class="block border-b border-[#18312F]/10 py-4 hover:text-[#218F86]">
                                Home
                            </a>
                        </li>

                        <li>
                            <a href="/services" class="block border-b border-[#18312F]/10 py-4 hover:text-[#218F86]">
                                Services
                            </a>
                        </li>

                        <li>
                            <a href="/gallery" class="block border-b border-[#18312F]/10 py-4 hover:text-[#218F86]">
                                Gallery
                            </a>
                        </li>

                        <li>
                            <a href="/team" class="block border-b border-[#18312F]/10 py-4 hover:text-[#218F86]">
                                Our Team
                            </a>
                        </li>

                        <li>
                            <a href="/contact" class="block py-4 hover:text-[#218F86]">
                                Contact
                            </a>
                        </li>
                    </ul>

                    <div class="px-5 pb-5">
                        <a
                            href="/contact"
                            class="
                                flex w-full
                                items-center justify-center
                                bg-[#218F86]
                                px-5 py-4
                                text-xs
                                font-semibold
                                uppercase
                                tracking-[0.2em]
                                text-white
                                transition
                                hover:bg-[#197A73]
                            "
                        >
                            Book an Appointment
                        </a>
                    </div>
                </nav>
            </details>

        </div>
    </div>
</header>
{{ end }}
