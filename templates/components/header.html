{{ define "header" }}
<header
    class="
        sticky top-0 z-50
        border-b border-white/15
        bg-[#218F86]/95
        font-sans
        shadow-[0_4px_24px_rgba(0,0,0,0.08)]
        backdrop-blur-xl
    "
>
    <div class="mx-auto max-w-6xl px-4 sm:px-6">
        <div class="flex h-20 items-center justify-between lg:h-24">

            <!-- Brand -->
            <a
                href="/"
                class="
                    flex min-w-0 items-center gap-2.5
                    sm:gap-3
                "
                aria-label="Studio Hair & Beauty home"
            >
                <img
                    src="/static/images/logo.svg"
                    alt=""
                    class="
                        size-11 shrink-0
                        sm:size-12
                        lg:size-14
                    "
                    aria-hidden="true"
                >

                <div class="min-w-0 leading-none text-white">
                    <span
                        class="
                            block truncate
                            text-[0.95rem]
                            font-medium
                            tracking-[0.08em]
                            sm:text-base
                            lg:text-lg
                        "
                    >
                        Studio Hair
                    </span>

                    <span
                        class="
                            mt-1.5 block
                            text-[0.55rem]
                            font-medium
                            uppercase
                            tracking-[0.28em]
                            text-white/65
                            sm:text-[0.6rem]
                        "
                    >
                        Hair & Beauty
                    </span>
                </div>
            </a>

            <!-- Desktop -->
            <div class="hidden items-center gap-9 lg:flex">
                <nav aria-label="Main navigation">
                    <ul
                        class="
                            flex items-center gap-8
                            text-[0.78rem]
                            font-medium
                            uppercase
                            tracking-[0.12em]
                            text-white/75
                        "
                    >
                        <li>
                            <a
                                href="/"
                                class="
                                    border-b border-transparent
                                    pb-1.5
                                    transition
                                    hover:border-white/60
                                    hover:text-white
                                    focus-visible:outline-2
                                    focus-visible:outline-offset-4
                                    focus-visible:outline-white
                                "
                            >
                                Home
                            </a>
                        </li>

                        <li>
                            <a
                                href="/services"
                                class="
                                    border-b border-transparent
                                    pb-1.5
                                    transition
                                    hover:border-white/60
                                    hover:text-white
                                    focus-visible:outline-2
                                    focus-visible:outline-offset-4
                                    focus-visible:outline-white
                                "
                            >
                                Services
                            </a>
                        </li>

                        <li>
                            <a
                                href="/gallery"
                                class="
                                    border-b border-transparent
                                    pb-1.5
                                    transition
                                    hover:border-white/60
                                    hover:text-white
                                    focus-visible:outline-2
                                    focus-visible:outline-offset-4
                                    focus-visible:outline-white
                                "
                            >
                                Gallery
                            </a>
                        </li>

                        <li>
                            <a
                                href="/team"
                                class="
                                    border-b border-transparent
                                    pb-1.5
                                    transition
                                    hover:border-white/60
                                    hover:text-white
                                    focus-visible:outline-2
                                    focus-visible:outline-offset-4
                                    focus-visible:outline-white
                                "
                            >
                                Our Team
                            </a>
                        </li>

                        <li>
                            <a
                                href="/contact"
                                class="
                                    border-b border-transparent
                                    pb-1.5
                                    transition
                                    hover:border-white/60
                                    hover:text-white
                                    focus-visible:outline-2
                                    focus-visible:outline-offset-4
                                    focus-visible:outline-white
                                "
                            >
                                Contact
                            </a>
                        </li>
                    </ul>
                </nav>

                <a
                    href="/contact"
                    class="
                        inline-flex items-center justify-center
                        border border-white/70
                        px-6 py-3
                        text-[0.72rem]
                        font-semibold
                        uppercase
                        tracking-[0.16em]
                        text-white
                        transition
                        hover:bg-white
                        hover:text-[#218F86]
                        focus-visible:outline-2
                        focus-visible:outline-offset-4
                        focus-visible:outline-white
                    "
                >
                    Book Now
                </a>
            </div>

            <!-- Mobile menu -->
            <details class="group relative shrink-0 lg:hidden">
                <summary
                    class="
                        flex cursor-pointer list-none
                        items-center justify-center
                        border border-white/25
                        p-2
                        text-white
                        transition
                        hover:bg-white/10
                    "
                    aria-label="Toggle navigation"
                >
                    <!-- Hamburger -->
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        class="size-6 group-open:hidden"
                        aria-hidden="true"
                    >
                        <path d="M4 7h16M4 12h16M4 17h16"></path>
                    </svg>

                    <!-- Close -->
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        class="hidden size-6 group-open:block"
                        aria-hidden="true"
                    >
                        <path d="M6 6l12 12M18 6L6 18"></path>
                    </svg>
                </summary>

                <nav
                    class="
                        absolute right-0 top-full
                        mt-4
                        w-[min(22rem,calc(100vw-2rem))]
                        overflow-hidden
                        border border-black/5
                        bg-[#FAFAF8]
                        shadow-[0_20px_60px_rgba(0,0,0,0.18)]
                    "
                    aria-label="Mobile navigation"
                >

                    <!-- Mobile menu branding -->
                    <div
                        class="
                            flex items-center gap-3
                            border-b border-[#218F86]/15
                            bg-[#218F86]/5
                            px-5 py-5
                        "
                    >
                        <img
                            src="/static/images/logo.svg"
                            alt=""
                            class="size-12 shrink-0"
                            aria-hidden="true"
                        >

                        <div class="leading-none">
                            <span
                                class="
                                    block
                                    text-base
                                    font-medium
                                    tracking-[0.06em]
                                    text-[#176F69]
                                "
                            >
                                Studio Hair
                            </span>

                            <span
                                class="
                                    mt-1.5 block
                                    text-[0.6rem]
                                    font-semibold
                                    uppercase
                                    tracking-[0.28em]
                                    text-[#218F86]/65
                                "
                            >
                                Hair & Beauty
                            </span>
                        </div>
                    </div>

                    <!-- Links -->
                    <ul
                        class="
                            flex flex-col
                            px-3 py-3
                            text-sm
                            font-medium
                            text-zinc-700
                        "
                    >
                        <li>
                            <a
                                href="/"
                                class="
                                    block
                                    border-b border-zinc-200/70
                                    px-3 py-4
                                    tracking-wide
                                    transition
                                    hover:px-4
                                    hover:text-[#218F86]
                                "
                            >
                                Home
                            </a>
                        </li>

                        <li>
                            <a
                                href="/services"
                                class="
                                    block
                                    border-b border-zinc-200/70
                                    px-3 py-4
                                    tracking-wide
                                    transition
                                    hover:px-4
                                    hover:text-[#218F86]
                                "
                            >
                                Services
                            </a>
                        </li>

                        <li>
                            <a
                                href="/gallery"
                                class="
                                    block
                                    border-b border-zinc-200/70
                                    px-3 py-4
                                    tracking-wide
                                    transition
                                    hover:px-4
                                    hover:text-[#218F86]
                                "
                            >
                                Gallery
                            </a>
                        </li>

                        <li>
                            <a
                                href="/team"
                                class="
                                    block
                                    border-b border-zinc-200/70
                                    px-3 py-4
                                    tracking-wide
                                    transition
                                    hover:px-4
                                    hover:text-[#218F86]
                                "
                            >
                                Our Team
                            </a>
                        </li>

                        <li>
                            <a
                                href="/contact"
                                class="
                                    block
                                    px-3 py-4
                                    tracking-wide
                                    transition
                                    hover:px-4
                                    hover:text-[#218F86]
                                "
                            >
                                Contact
                            </a>
                        </li>
                    </ul>

                    <!-- Mobile CTA -->
                    <div class="px-5 pb-5">
                        <a
                            href="/contact"
                            class="
                                flex w-full
                                items-center justify-center
                                bg-[#218F86]
                                px-5 py-4
                                text-xs
                                font-semibold
                                uppercase
                                tracking-[0.2em]
                                text-white
                                transition
                                hover:bg-[#197A73]
                            "
                        >
                            Book an Appointment
                        </a>
                    </div>

                    <!-- Small brand detail -->
                    <div
                        class="
                            border-t border-zinc-200
                            px-5 py-4
                            text-center
                        "
                    >
                        <p
                            class="
                                text-[0.6rem]
                                uppercase
                                tracking-[0.28em]
                                text-zinc-400
                            "
                        >
                            Look · Feel · Be You
                        </p>
                    </div>

                </nav>
            </details>

        </div>
    </div>
</header>
{{ end }}
