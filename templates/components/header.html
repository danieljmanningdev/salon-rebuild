{{ define "header" }}

<header
    class="
        sticky top-0 z-50
        border-b border-white/10
        bg-[#18312F]/98
        font-sans
        backdrop-blur-xl
    "
>
    <div class="mx-auto max-w-6xl px-5 sm:px-6">
        <div class="flex h-20 items-center justify-between lg:h-24">

            <!-- =====================================================
                 BRAND
            ====================================================== -->
            <a
                href="/"
                class="flex min-w-0 items-center gap-3"
                aria-label="Studio Hair & Beauty home"
            >
                <img
                    src="/static/images/logo.svg"
                    alt=""
                    class="size-11 shrink-0 sm:size-12 lg:size-14"
                    aria-hidden="true"
                >

                <div class="min-w-0 leading-none">

                    <span
                        class="
                            block
                            text-[0.95rem]
                            font-medium
                            tracking-[0.07em]
                            text-white
                            sm:text-base
                            lg:text-lg
                        "
                    >
                        Studio Hair
                    </span>

                    <span
                        class="
                            mt-1.5 block
                            text-[0.55rem]
                            font-semibold
                            uppercase
                            tracking-[0.28em]
                            text-[#5FC8BE]
                            sm:text-[0.6rem]
                        "
                    >
                        Hair &amp; Beauty
                    </span>

                </div>
            </a>


            <!-- =====================================================
                 DESKTOP NAVIGATION
            ====================================================== -->
            <div class="hidden items-center gap-10 lg:flex">

                <nav aria-label="Main navigation">
                    <ul
                        class="
                            flex items-center gap-8
                            text-[0.7rem]
                            font-semibold
                            uppercase
                            tracking-[0.15em]
                            text-white/65
                        "
                    >

                        <li>
                            <a
                                href="/"
                                class="
                                    transition
                                    hover:text-white
                                    focus-visible:outline-2
                                    focus-visible:outline-offset-4
                                    focus-visible:outline-[#5FC8BE]
                                "
                            >
                                Home
                            </a>
                        </li>

                        <li>
                            <a
                                href="/services"
                                class="
                                    transition
                                    hover:text-white
                                    focus-visible:outline-2
                                    focus-visible:outline-offset-4
                                    focus-visible:outline-[#5FC8BE]
                                "
                            >
                                Services
                            </a>
                        </li>

                        <li>
                            <a
                                href="/gallery"
                                class="
                                    transition
                                    hover:text-white
                                    focus-visible:outline-2
                                    focus-visible:outline-offset-4
                                    focus-visible:outline-[#5FC8BE]
                                "
                            >
                                Gallery
                            </a>
                        </li>

                        <li>
                            <a
                                href="/team"
                                class="
                                    transition
                                    hover:text-white
                                    focus-visible:outline-2
                                    focus-visible:outline-offset-4
                                    focus-visible:outline-[#5FC8BE]
                                "
                            >
                                Our Team
                            </a>
                        </li>

                        <li>
                            <a
                                href="/contact"
                                class="
                                    transition
                                    hover:text-white
                                    focus-visible:outline-2
                                    focus-visible:outline-offset-4
                                    focus-visible:outline-[#5FC8BE]
                                "
                            >
                                Contact
                            </a>
                        </li>

                    </ul>
                </nav>


                <!-- Booking CTA -->
                <a
    href="/contact"
    class="
        inline-flex
        items-center justify-center
        bg-[#F7F5F1]
        px-6 py-3.5
        text-[0.68rem]
        font-semibold
        uppercase
        tracking-[0.18em]
        text-[#18312F]
        transition
        hover:bg-white
    "
>
    Book Now
</a>

            </div>


            <!-- =====================================================
                 MOBILE NAVIGATION
            ====================================================== -->
            <details class="group relative shrink-0 lg:hidden">

                <summary
                    class="
                        flex cursor-pointer list-none
                        items-center justify-center
                        p-2
                        text-white
                        transition
                        hover:text-[#5FC8BE]
                    "
                    aria-label="Toggle navigation"
                >

                    <!-- Hamburger -->
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.4"
                        stroke-linecap="round"
                        class="size-7 group-open:hidden"
                        aria-hidden="true"
                    >
                        <path d="M4 7h16M4 12h16M4 17h16"></path>
                    </svg>

                    <!-- Close -->
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.4"
                        stroke-linecap="round"
                        class="hidden size-7 group-open:block"
                        aria-hidden="true"
                    >
                        <path d="M6 6l12 12M18 6L6 18"></path>
                    </svg>

                </summary>


                <!-- Dropdown -->
                <nav
                    class="
                        absolute right-0 top-full
                        mt-3
                        w-[min(22rem,calc(100vw-2rem))]
                        overflow-hidden
                        border border-white/10
                        bg-[#18312F]
                        shadow-[0_24px_70px_rgba(0,0,0,0.28)]
                    "
                    aria-label="Mobile navigation"
                >

                    <!-- Repeated branding -->
                    <div
                        class="
                            flex items-center gap-3
                            border-b border-white/10
                            bg-white/5
                            px-5 py-5
                        "
                    >

                        <img
                            src="/static/images/logo.svg"
                            alt=""
                            class="size-12 shrink-0"
                            aria-hidden="true"
                        >

                        <div class="leading-none">

                            <span
                                class="
                                    block
                                    text-base
                                    font-medium
                                    tracking-[0.06em]
                                    text-white
                                "
                            >
                                Studio Hair
                            </span>

                            <span
                                class="
                                    mt-1.5 block
                                    text-[0.6rem]
                                    font-semibold
                                    uppercase
                                    tracking-[0.28em]
                                    text-[#5FC8BE]
                                "
                            >
                                Hair &amp; Beauty
                            </span>

                        </div>
                    </div>


                    <!-- Links -->
                    <ul
                        class="
                            flex flex-col
                            px-5 py-3
                            text-sm
                            font-medium
                            text-white/65
                        "
                    >

                        <li>
                            <a
                                href="/"
                                class="
                                    block
                                    border-b border-white/10
                                    py-4
                                    transition
                                    hover:text-white
                                "
                            >
                                Home
                            </a>
                        </li>

                        <li>
                            <a
                                href="/services"
                                class="
                                    block
                                    border-b border-white/10
                                    py-4
                                    transition
                                    hover:text-white
                                "
                            >
                                Services
                            </a>
                        </li>

                        <li>
                            <a
                                href="/gallery"
                                class="
                                    block
                                    border-b border-white/10
                                    py-4
                                    transition
                                    hover:text-white
                                "
                            >
                                Gallery
                            </a>
                        </li>

                        <li>
                            <a
                                href="/team"
                                class="
                                    block
                                    border-b border-white/10
                                    py-4
                                    transition
                                    hover:text-white
                                "
                            >
                                Our Team
                            </a>
                        </li>

                        <li>
                            <a
                                href="/contact"
                                class="
                                    block
                                    py-4
                                    transition
                                    hover:text-white
                                "
                            >
                                Contact
                            </a>
                        </li>

                    </ul>


                    <!-- Mobile booking CTA -->
                    <div class="px-5 pb-5">

                        <a
                            href="/contact"
                            class="
                                flex w-full
                                items-center justify-center
                                bg-[#26A69A]
                                px-5 py-4
                                text-xs
                                font-semibold
                                uppercase
                                tracking-[0.2em]
                                text-white
                                transition
                                hover:bg-[#35B8AC]
                            "
                        >
                            Book an Appointment
                        </a>

                    </div>


                    <!-- Brand detail -->
                    <div
                        class="
                            border-t border-white/10
                            px-5 py-4
                            text-center
                        "
                    >
                        <p
                            class="
                                text-[0.55rem]
                                font-medium
                                uppercase
                                tracking-[0.3em]
                                text-white/35
                            "
                        >
                            Look · Feel · Be You
                        </p>
                    </div>

                </nav>

            </details>

        </div>
    </div>
</header>

{{ end }}
